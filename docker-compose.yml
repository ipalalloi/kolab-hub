# Kolab-Hub di satu VPS: aplikasi + PostgreSQL + Caddy (HTTPS otomatis).
# Semua rahasia dibaca dari .env di VPS (lihat .env.example). Jangan commit .env.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_DRIVER: pg
      DATABASE_URL: postgres://kolab:${POSTGRES_PASSWORD}@db:5432/kolab
      PORT: "3000"
      SECURE_COOKIES: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - files:/app/data/files
    expose:
      - "3000"

  # Aktifkan bila WORKER_INLINE=false (beberapa instance app di belakang proxy).
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_DRIVER: pg
      DATABASE_URL: postgres://kolab:${POSTGRES_PASSWORD}@db:5432/kolab
    command: ["node", "--no-warnings=ExperimentalWarning", "src/jobs/run-worker.js"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["worker"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolab
      POSTGRES_USER: kolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolab -d kolab"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?isi DOMAIN di .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
